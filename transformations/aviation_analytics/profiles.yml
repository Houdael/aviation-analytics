aviation_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AVIATION_ANALYTICS_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'AVIATION_DBT_DEV_WH') }}"
      schema: staging
      role: AVIATION_DBT_DEV_ROLE
      threads: 4
      client_session_keep_alive: false

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
      database: AVIATION_ANALYTICS_PROD
      warehouse: AVIATION_DBT_PROD_WH
      schema: staging
      role: AVIATION_DBT_PROD_ROLE
      threads: 4
      client_session_keep_alive: false

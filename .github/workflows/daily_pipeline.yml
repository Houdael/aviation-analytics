name: Daily Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Ingest & Transform
    runs-on: ubuntu-latest

    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dlt ingestion pipeline
        run: python ingestion/opensky_pipeline.py

      - name: Install dbt packages
        working-directory: transformations/aviation_analytics
        run: dbt deps --profiles-dir .

      - name: Run dbt models
        working-directory: transformations/aviation_analytics
        run: dbt run --profiles-dir .

      - name: Run dbt tests
        working-directory: transformations/aviation_analytics
        run: dbt test --profiles-dir .

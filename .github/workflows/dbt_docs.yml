name: dbt Docs

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    name: Generate & Deploy dbt Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: transformations/aviation_analytics
        run: dbt deps --profiles-dir .

      - name: Generate dbt docs
        working-directory: transformations/aviation_analytics
        run: dbt docs generate --profiles-dir .

      - name: Install Elementary
        run: pip install "elementary-data[snowflake]"

      - name: Generate Elementary report
        working-directory: transformations/aviation_analytics
        run: |
          mkdir -p /tmp/elementary_profiles
          cat > /tmp/elementary_profiles/profiles.yml <<EOF
          elementary:
            outputs:
              default:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                schema: elementary
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                role: AVIATION_DBT_DEV_ROLE
            target: default
          EOF
          edr report \
            --project-dir . \
            --profiles-dir /tmp/elementary_profiles \
            --profile-target default \
            --file-path target/elementary_report.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: transformations/aviation_analytics/target

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
